services:
  - type: web
    name: bestauction-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: bestauction-demo-db
          property: connectionString
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: DemoSeed__Enabled
        value: "true"
      - key: DemoSeed__Password
        generateValue: true

databases:
  - name: bestauction-demo-db
    plan: free
    databaseName: auction
